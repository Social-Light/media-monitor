<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Media Monitor{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .stat-card .display-6 { font-size: 2rem; }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard:overview' %}">Media Monitor</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="{% url 'dashboard:overview' %}">Overview</a>
      <a class="nav-link" href="{% url 'dashboard:seed-list' %}">Seeds</a>
      <a class="nav-link" href="{% url 'dashboard:article-list' %}">Articles</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>
</html>
